[project]
name = "memo-hub-backend"
version = "0.1.0"
description = "AI Meeting Translator & Memo Hub — backend API (Workstream 1)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.1",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "python-multipart==0.0.32",
  "pyjwt[crypto]==2.15.1",
  "charset-normalizer==3.5.2",
  "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/seed.py" = ["S105", "S106"]
"alembic/versions/*" = ["E501"]
"app/services/export.py" = ["E501"]  # inline CSS in the HTML export template

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
